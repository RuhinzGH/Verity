name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # the same install as the live app (CPU build of torch on Linux); the suite is offline
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
