[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#05060b"
secondaryBackgroundColor = "#0e1120"
textColor = "#e6eaf8"
borderColor = "#1d2236"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.8rem"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"

[theme.light]
primaryColor = "#0891b2"
backgroundColor = "#f6f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#141a2e"
borderColor = "#dde1ec"

[theme.dark]
primaryColor = "#22d3ee"
backgroundColor = "#05060b"
secondaryBackgroundColor = "#0e1120"
textColor = "#e6eaf8"
borderColor = "#1d2236"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
